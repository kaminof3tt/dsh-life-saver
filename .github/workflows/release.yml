name: release

# 发布 = 往这个仓推一个 v* tag，或者在 Actions 里手动跑一次并填版本号。
# 两个包一起发，顺序固定：life-saver-core 先上，确认能从 npm 查到之后再发 dsh-life-saver。
# 版本号唯一来源就是这个 tag；manifest 里的 version 由流水线现场改、不提交回仓。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号，例如 0.9.0
        required: true
        type: string
      dry_run:
        description: 只构建、测试和打包，不真正发布
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # --provenance 需要

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 解析版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 写入版本号（不提交）
        run: node scripts/apply-version.mjs "${{ steps.version.outputs.value }}"

      - name: 断言三个 manifest 版本一致
        run: |
          node -e '
            const fs = require("node:fs");
            const want = process.argv[1];
            const files = ["package.json", "packages/core/package.json", "packages/plugin/package.json"];
            const versions = files.map((f) => JSON.parse(fs.readFileSync(f, "utf8")).version);
            if (versions.some((v) => v !== want)) {
              console.error("版本不一致：", files.map((f, i) => `${f}=${versions[i]}`).join(" "));
              process.exit(1);
            }
            console.log("三个 manifest 都是", want);
          ' "${{ steps.version.outputs.value }}"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm -r typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: 发布
        if: ${{ inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"

          # 幂等：已经发过的包跳过，失败路径绝不 npm unpublish
          publish_one() {
            name="$1"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION 已经发布过，跳过"
              return 0
            fi
            echo "发布 $name@$VERSION"
            pnpm --filter "$name" publish --access public --no-git-checks --provenance
          }

          publish_one life-saver-core

          # registry 传播有延迟：壳的依赖钉的是同版本 core，等它能查到再发壳
          for attempt in $(seq 1 24); do
            if npm view "life-saver-core@$VERSION" version > /dev/null 2>&1; then
              echo "life-saver-core@$VERSION 已可从 npm 查到"
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "等了 2 分钟仍查不到 life-saver-core@$VERSION" >&2
              exit 1
            fi
            sleep 5
          done

          publish_one dsh-life-saver

          echo "已完成 $VERSION：life-saver-core + dsh-life-saver"
